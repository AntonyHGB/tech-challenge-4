[project]
name = "credito-baseline"
version = "0.1.0"
description = "Validação de dados e contratos para o classificador de risco de crédito (Tech Challenge Fase 04)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "great-expectations==1.23.0",
    "kagglehub==1.0.2",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
